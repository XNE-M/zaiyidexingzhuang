<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef3e9"><meta name="description" content="10个友情情境，发现最打动你的在意。"><title>在意的形状 · 友情心动测试</title><style>
:root{--ink:#293d33;--muted:#6e7b70;--paper:#fafaf4;--line:#dce3d5;--green:#48654b;--pink:#e9c4b6}*{box-sizing:border-box}body{margin:0;background:#eef3e9;color:var(--ink);font-family:system-ui,-apple-system,'PingFang SC',sans-serif;line-height:1.8}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ba895b;outline-offset:4px}header{max-width:1120px;margin:auto;padding:26px 34px;display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:2px}.brand{font-size:17px;font-weight:650;letter-spacing:3px}.tiny{color:var(--muted);font-size:12px;letter-spacing:1px}main{max-width:1120px;margin:12px auto 50px;padding:0 34px}.sheet{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:64px;box-shadow:0 16px 55px #334b3510}.hero{display:grid;grid-template-columns:1.2fr 1fr;align-items:center;min-height:560px;gap:35px}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--green);margin-bottom:23px}h1{font-family:'Songti SC','Noto Serif CJK SC',serif;font-size:clamp(38px,5vw,60px);font-weight:500;line-height:1.35;letter-spacing:2px;margin:0 0 24px}h1 em{font-style:normal;background:linear-gradient(transparent 66%,#e0e8a9 0)}p{margin:0 0 18px}.intro{max-width:470px;color:var(--muted);font-size:15px}.primary{background:var(--green);color:white;border:0;padding:14px 29px;border-radius:50px;transition:.2s}.primary:hover{background:#304e36;transform:translateY(-1px)}.subtle{border:1px solid var(--line);background:transparent;border-radius:40px;padding:10px 22px;color:var(--ink)}.meta{font-size:12px;color:var(--muted);margin:19px 0}.art{position:relative;height:390px;display:flex;align-items:center;justify-content:center}.circle{position:absolute;width:310px;height:310px;border-radius:50%;background:#e9eddf}.petal{position:absolute;width:130px;height:180px;background:#a9bb96;border-radius:70% 70% 45% 45%;transform-origin:50% 90%;opacity:.8;bottom:115px}.petal:nth-child(2){transform:rotate(-72deg);background:#d7bb9d}.petal:nth-child(3){transform:rotate(0);background:#b6c5a3}.petal:nth-child(4){transform:rotate(72deg);background:#d4d6a7}.petal:nth-child(5){transform:rotate(144deg);background:#c5b4b9}.petal:nth-child(6){transform:rotate(216deg);background:#e0c4a9}.center{width:52px;height:52px;background:#f7f4de;border-radius:50%;position:absolute;top:221px;box-shadow:0 0 0 10px #fafaf430}.art-label{position:absolute;bottom:0;letter-spacing:3px;font-size:13px;color:var(--muted)}.foot{margin:24px auto;text-align:center;max-width:700px;color:var(--muted);font-size:11px}.quiz{max-width:780px;margin:auto}.topline{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.progress{height:4px;background:#e6e9df;border-radius:5px;margin:18px 0 40px}.fill{height:100%;background:var(--green);border-radius:5px;transition:width .3s}.question{font-family:'Songti SC',serif;font-size:30px;line-height:1.6;font-weight:500;margin:10px 0 29px}.option{width:100%;display:flex;align-items:center;gap:18px;text-align:left;background:#fffef9;border:1px solid var(--line);border-radius:16px;padding:22px;margin:13px 0;color:var(--ink);font-size:15px;transition:.2s}.option:hover{border-color:#8eaa82;background:#f4f7ee}.option.selected{border-color:var(--green);background:#edf2e5;box-shadow:0 0 0 1px var(--green)}.letter{border:1px solid #ccd6c3;border-radius:50%;width:33px;height:33px;display:grid;place-items:center;flex-shrink:0;font-size:12px}.selected .letter{background:var(--green);color:white}.nav{display:flex;justify-content:space-between;margin-top:30px;gap:15px}button:disabled{opacity:.4;cursor:default;transform:none}.quote{font-family:'Songti SC',serif;font-size:25px;line-height:1.7;margin:20px 0 30px}.tag{display:inline-block;font-size:12px;border-radius:20px;background:#e7eddd;padding:5px 13px;margin:0 6px 8px 0}.result-title{font-family:'Songti SC',serif;font-size:43px;margin:10px 0}.result-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:35px;margin-top:30px}.block{border-top:1px solid var(--line);padding-top:22px;margin-top:24px}.block h3{font-size:14px;letter-spacing:1px;margin:0 0 10px}.block p{font-size:14px;color:var(--muted)}.say{background:#eef0e3;padding:20px;border-radius:15px}.scores{background:#f0f2e9;padding:26px;border-radius:18px;align-self:start}.score{margin:15px 0}.score-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}.track{height:6px;background:#dce4d3;border-radius:5px}.track i{display:block;height:100%;background:#8caa7c;border-radius:5px}.note{font-size:12px;color:var(--muted)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:40px;padding:12px 25px;font-size:13px;z-index:2}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px}.fade{animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:700px){header{padding:22px}.tiny{font-size:10px}main{padding:0 16px;margin-top:0}.sheet{padding:28px 23px;border-radius:22px}.hero{display:flex;flex-direction:column-reverse;gap:12px;align-items:stretch}.art{height:190px;overflow:hidden}.circle{width:175px;height:175px}.petal{width:70px;height:96px;bottom:64px}.center{width:28px;height:28px;top:102px}.art-label{display:none}.eyebrow{margin-bottom:15px;font-size:10px}h1{font-size:39px}.intro{font-size:14px}.hero .primary{width:100%}.question{font-size:25px}.progress{margin-bottom:28px}.option{padding:18px 15px;gap:12px;font-size:14px}.result-grid{grid-template-columns:1fr;gap:15px}.result-title{font-size:36px}.quote{font-size:22px}.nav .primary{padding:12px 22px}.foot{padding:0 18px}.brand{font-size:15px}}
</style></head><body><header><span class="brand">✳ 在意的形状</span><span class="tiny">A LITTLE CLOSER TO YOU</span></header><main id="app"></main><footer class="foot">一次关于友情的温柔探索 · 仅用于娱乐与自我反思，不是心理测量或诊断<br>答案仅保存在当前浏览器，不会上传。</footer><script>
const questions=[
['生日那天，哪件事更让你心动？','对方送来你几个月前随口提过、后来自己都忘了的小东西。','你最近过得很乱，对方说：“今天不用打起精神，我带点吃的来陪你。”',0,3],
['有人对你产生误解，你更希望朋友怎么回应？','对方能说清：“她那样做是有原因的，我知道她当时在担心什么。”','对方在现场表态：“这件事我有不同看法，我想先听她说完。”',1,2],
['多年后重逢，哪句话更容易击中你？','“你以前说想去的那个地方，我后来路过，还专门拍给你看。”','“我换了几次手机，那张我们一起拍的照片一直都在。”',0,4],
['你状态很差，哪一种陪伴更合心意？','你说不清自己怎么了，对方也愿意陪你吃饭、散步，等你慢慢开口。','对方听着你前后矛盾的话，说：“你想离开，又舍不得，这两种感觉可以同时存在。”',3,1],
['你们各自有了新的生活，哪个细节更让你安心？','对方认识了许多新朋友，安排重要聚会时，仍会认真问你能不能来。','你们很久没见，对方仍会在每年的某一天发来：“又到我们当年认识的日子了。”',2,4],
['你提起一个别人觉得很奇怪的愿望，哪种回应更打动你？','隔了一阵，对方发来相关信息：“看到这个，想到你之前说想试试。”','对方问了几句，然后说：“我好像知道你为什么一直想做这件事了。”',0,1],
['你遇到麻烦时，哪个举动更容易被你记住？','当时有更轻松的选择，对方仍明确说：“这件事我陪你一起处理。”','对方来接你，帮你把眼前最难熬的那个晚上过完。',2,3],
['从别人那里听到朋友谈起你，哪种描述更让你动容？','“她看起来什么都无所谓，可那件事她准备了很久。”','“我们现在见得少了，但讲到那段日子，我还是第一个想到她。”',1,4],
['你们一起出门，哪个瞬间更让你觉得被放在心上？','对方点单时记得你的口味，连你自己都没特意交代。','大家临时改变计划，对方注意到你有些为难，主动留下来和你商量。',0,2],
['一段友情里，你更珍惜哪一种经历？','有一阵你很消沉、很难相处，对方陪你一点点恢复日常。','你们的人生渐渐走向不同方向，但那些共同经历一直被对方认真提起。',3,4]
];
const types=[
{name:'被记住',quote:'原来，我随口说的话，你真的听进去了。',short:'你随口一说，我放在心上。',body:'你容易被那些延迟出现的回应打动。你说过的愿望、挑食的小习惯、某次聊天提到的烦恼，隔了很久仍有人记得。|这些细节让“我在意你”有了可以看见的样子。对方也许没有郑重表达，你却能从一个小动作里感受到，自己一直占据着对方的一点注意力。',give:'你也可能这样关心朋友：看到一件东西想到她，提前记下她的重要日期，替她留意提过的机会。',risk:'你记得很清楚，因此也容易对朋友的遗忘失落。但记忆习惯存在差异，某一次忘记，需要放回整段相处里理解。',say:'你居然记得这件事，我真的很开心。这样的细节会让我感觉我们很亲近。'},
{name:'被读懂',quote:'你居然知道，我那时候为什么会那样。',short:'你说起我时，连我的犹豫都有来处。',body:'你容易被准确的理解打动。对方听得出玩笑里的认真，也愿意追问你看似反常的决定。|让你动容的，可能是一句很具体的描述：原来自己的犹豫、别扭和沉默，有人愿意花时间理解。在这个人面前，复杂一点也能被容纳。',give:'你也可能习惯替朋友补上别人没看到的背景，记得她行为背后的顾虑，愿意多问一句“当时发生了什么”。',risk:'渴望被理解，有时会让你期待对方自行察觉。再熟悉的人也有读不懂的时刻，表达能为理解提供线索。',say:'我现在有点说不清，你愿意听我慢慢讲吗？也可以问问我。'},
{name:'被选择',quote:'当时你有别的选择，你还是向我走来了。',short:'人群里，你认真为我留了位置。',body:'你容易被明确的行动打动。人多的时候有没有顾及你，出现分歧时愿不愿意听你说，安排生活时是否给你留下位置，这些都影响你对关系的感受。|当对方有自己的判断，也清楚表达对你的重视，你会更安心。那让你知道，彼此的靠近包含主动的意愿。',give:'你也可能用行动表达友情：主动邀约、兑现约定，在朋友需要回应时给出明确答复。',risk:'你可能会在不安时留意对方“先选谁”。但朋友可以同时珍惜多段关系，某次安排的先后，未必能说明整段友情的位置。',say:'这件事对我挺重要的，我很希望你能来。你方便的时候，我们提前定下来好吗？'},
{name:'被接住',quote:'那阵子我连自己都顾不好，你陪我过完了那些天。',short:'我最狼狈的那天，也有人愿意靠近。',body:'你容易被困难时具体的陪伴打动。一顿送来的饭，一次愿意接听的电话，一段没有被催促着振作的时间，都可能留在你记忆里。|在低落、疲惫或表达混乱时，对方仍愿意和你相处，会让你逐渐放松。你感受到，关系能够承受状态的起伏。',give:'你也可能很擅长提供实际照顾：陪朋友处理眼前的问题，确认她有没有吃饭，在她暂时说不出话时陪着坐一会儿。',risk:'感激陪伴，可能让你觉得自己欠了很大的人情。接受支持可以包含感谢，也可以保留边界；朋友同样需要休息和自己的生活。',say:'我今天有点难熬。你今晚方便陪我聊十分钟吗？我暂时只想有人听听。'},
{name:'被珍藏',quote:'原来，那段日子也一直在你心里。',short:'后来走了很远，那段日子还被好好收着。',body:'你容易被跨越时间的在意打动。旧照片仍被保存，一句只有你们懂的话再次出现，多年前的小事被郑重讲起，都可能让你忽然动容。|生活会改变联系的频率，你在意共同经历是否仍被对方承认、珍惜。当对方认真谈起过去，你会感受到，那段相处在彼此身上都留下了痕迹。',give:'你也可能保存聊天、照片和纪念物，隔一阵重新想起朋友，记得一些早已无人提起的日子。',risk:'珍惜过去，偶尔会让人期待关系恢复原样。共同经历可以继续有意义，新的相处方式也需要双方重新寻找。',say:'今天突然想到我们以前那件事，还是觉得很好笑。想发给你，也想知道你最近怎么样。'}
];
let answers=Array(10).fill(null),index=0,mode='home',active=0;try{const s=JSON.parse(localStorage.getItem('care-v1'));if(s&&Array.isArray(s.answers)&&s.answers.length===10&&s.answers.every(v=>v===null||v===0||v===1)){answers=s.answers;index=Math.max(0,Math.min(9,s.index||0));}}catch(e){}
const app=document.getElementById('app');function save(){try{localStorage.setItem('care-v1',JSON.stringify({answers,index}));}catch(e){}}function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}function scores(){let s=[0,0,0,0,0];answers.forEach((v,i)=>{if(v!==null)s[questions[i][3+v]]++});return s}function ranking(){let s=scores();return types.map((_,i)=>i).sort((a,b)=>s[b]-s[a])}function start(){mode='quiz';index=answers.findIndex(v=>v===null);if(index<0)index=9;render();scrollTop()}function choose(v){answers[index]=v;save();render()}function next(){if(answers[index]===null)return;if(index<9){index++;save();render()}else{mode='result';active=ranking()[0];render()}scrollTop()}function prev(){if(index>0){index--;save();render();scrollTop()}else{mode='home';render()}}function restart(){answers=Array(10).fill(null);index=0;save();mode='quiz';render();scrollTop()}
function render(){if(mode==='home'){const count=answers.filter(x=>x!==null).length;app.innerHTML=`<section class="sheet hero fade"><div><div class="eyebrow">FRIENDSHIP · 友情心动测试</div><h1>你最容易被哪种<br>“<em>在意</em>”打动？</h1><p class="intro">有些瞬间看起来很小，却会被记很久。<br>是随口说过的话被记住，是解释不清时有人懂，还是生活改变以后，对方依然为你留着位置？</p><div class="meta">10 个情境 · 约 3 分钟 · 5 种在意</div><button class="primary" onclick="start()">${count?'继续我的探索':'发现我的心动瞬间'} <span aria-hidden="true">↗</span></button>${count?`<p class="note" style="margin-top:14px">已保留 ${count}/10 道答案 <button class="subtle" style="padding:2px 10px;margin-left:8px" onclick="restart()">重新开始</button></p>`:''}<p class="note" style="margin-top:23px">想一位对你有意义的朋友，跟着第一反应作答。</p></div><div class="art" aria-hidden="true"><div class="circle"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="center"></div><div class="art-label">每一种在意，都有自己的形状</div></div></section>`;return}if(mode==='quiz'){let q=questions[index];app.innerHTML=`<section class="sheet quiz fade"><div class="topline"><span>留意让你心动的那个瞬间</span><span>${String(index+1).padStart(2,'0')} / 10</span></div><div class="progress" role="progressbar" aria-valuenow="${answers.filter(v=>v!==null).length}" aria-valuemin="0" aria-valuemax="10" aria-label="答题进度"><div class="fill" style="width:${answers.filter(v=>v!==null).length*10}%"></div></div><div class="eyebrow">想象一下 / QUESTION ${String(index+1).padStart(2,'0')}</div><h2 class="question">${q[0]}</h2><p class="note">即使两个都喜欢，也选此刻更打动你的一个。</p>${[0,1].map(v=>`<button class="option ${answers[index]===v?'selected':''}" aria-pressed="${answers[index]===v}" onclick="choose(${v})"><span class="letter">${v?'B':'A'}</span><span>${q[v+1]}</span></button>`).join('')}<div class="nav"><button class="subtle" onclick="prev()">${index?'← 上一题':'← 回到首页'}</button><button class="primary" ${answers[index]===null?'disabled':''} onclick="next()">${index===9?'看看我的结果':'下一题'} →</button></div></section>`;return}
const s=scores(),rank=ranking(),top=rank.filter(i=>s[i]===s[rank[0]]),second=rank.filter(i=>s[i]<s[rank[0]]&&s[i]===s[rank.find(i=>s[i]<s[rank[0]])]);let t=types[active];app.innerHTML=`<section class="sheet fade"><div class="eyebrow">YOUR LITTLE SIGNS OF CARE / 你的结果</div><div class="tag">${top.length>1?'并列心动 · 多种在意同样动人':'本次最打动你的在意'}</div><h1 class="result-title">${top.map(i=>types[i].name).join(' · ')}</h1><p class="note">${top.length>1?'你的选择没有明显偏向一种方式。下面可以分别阅读每种解读。':`也让你心动：${second.map(i=>types[i].name).join('、')}`}</p><div class="actions" style="margin-top:16px">${rank.map(i=>`<button class="${active===i?'primary':'subtle'}" style="padding:7px 16px;font-size:13px" onclick="active=${i};render()">${types[i].name}</button>`).join('')}</div><div class="result-grid"><article><div class="eyebrow" style="margin-bottom:10px">正在阅读 / ${t.name}</div><div class="quote">“${t.quote}”</div>${t.body.split('|').map(p=>`<p>${p}</p>`).join('')}<div class="block"><h3>你也可能这样表达在意</h3><p>${t.give}</p></div><div class="block"><h3>容易出现的误会</h3><p>${t.risk}</p></div><div class="block"><h3>下次，可以试着说</h3><p class="say">“${t.say}”</p></div></article><aside class="scores"><div class="eyebrow">你的选择分布</div>${rank.map(i=>`<div class="score"><div class="score-label"><span>${types[i].name}</span><span>${s[i]} / 4</span></div><div class="track"><i style="width:${s[i]/4*100}%"></i></div></div>`).join('')}<p class="note" style="margin-top:24px">每种方式在题目中出现 4 次。分数表示这次作答的选择次数，不能衡量你有多需要爱，也不代表朋友对你的在意程度。</p><div class="block"><p style="font-family:serif;font-size:20px;color:var(--ink)">${t.short}</p></div></aside></div><div class="actions"><button class="primary" onclick="shareResult()">复制我的结果 ↗</button><button class="subtle" onclick="mode='quiz';index=9;render();scrollTop()">返回修改答案</button><button class="subtle" onclick="restart()">再测一次</button></div><p class="note" style="margin-top:20px" id="copy-note" aria-live="polite">这是一份当下的偏好记录，你也可以同时被多种在意打动。</p></section>`}
async function shareResult(){let s=scores(),rank=ranking(),top=rank.filter(i=>s[i]===s[rank[0]]);let text='在意的形状｜最打动我的是：'+top.map(i=>types[i].name).join('、')+'。\n'+top.map(i=>types[i].short).join('\n');try{await navigator.clipboard.writeText(text);document.getElementById('copy-note').textContent='已复制结果，可以粘贴给你想到的那个人。'}catch(e){document.getElementById('copy-note').textContent=text;}}render();
</script></body></html>
